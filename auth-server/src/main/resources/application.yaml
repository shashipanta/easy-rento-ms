spring:
  application:
    name: auth-server
  # use config server
  config:
    import: "configserver:${CONFIG_SERVER_URI:http://localhost:8888}"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8090
eureka:
  client:
    serviceUrl:
      default-zone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
