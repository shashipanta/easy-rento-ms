spring:
  server:
    address: 0.0.0.0
    port: 8080
  eureka:
    client:
      serviceUrl:
        default-zone: ${EUREKA_URI:http://localhost:8761/eureka}
    instance:
      prefer-ip-address: true
      ip-address: 192.168.1.23

  # for health endpoints
  management:
    endpoints:
      web:
        exposure:
          include: info, health
    endpoint:
      health:
        access: read_only
        show-details: always
      info:
        access: read_only
    server:
      base-path:

  logging:
    level:
      org:
        apache:
          coyote:
            http11: debug